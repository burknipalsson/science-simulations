<title>The Quantum Atom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --void: #04060a;
    --deep: #090c13;
    --ink: #e6eaf0;
    --muted: #9ba3b4;
    --faint: #687084;
    --line: rgba(230, 234, 240, 0.12);
    --line-strong: rgba(230, 234, 240, 0.24);
    --sun: #ffc46b;
    --sky: #8fc3ec;
    --hot: #ff9d5c;
    --einstein: #b99cff;
    --newton: #8fd3a8;
    --display: "Newsreader", "Iowan Old Style", Georgia, serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--void); color: var(--ink); margin: 0; }
  body { font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
  @media (min-width: 720px) { .wrap { padding-inline: 32px; } }

  header.top { padding-block: 40px 22px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 40px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sun); }
  h1 { font-family: var(--display); font-weight: 300; font-size: clamp(46px, 8.4vw, 104px); line-height: 0.92; letter-spacing: -0.025em; margin: 10px 0 0; text-wrap: balance; }
  h1 em { font-style: italic; color: var(--sun); }
  .lede { max-width: 46ch; color: var(--muted); margin: 0; font-size: 16px; }
  .lede strong { color: var(--ink); font-weight: 500; }

  .stage { position: relative; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #000; overflow: hidden; }
  #sky { display: block; width: 100%; height: clamp(480px, 78vh, 900px); cursor: grab; touch-action: none; }
  #sky:active { cursor: grabbing; }
  .hud { position: absolute; background: rgba(4, 6, 10, 0.64); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 4px; font-family: var(--mono); font-size: 12px; line-height: 1.55; font-variant-numeric: tabular-nums; }
  .readout { top: 14px; left: 14px; display: grid; grid-template-columns: auto auto; gap: 2px 14px; padding: 10px 14px; pointer-events: none; max-width: calc(100% - 28px); }
  .readout dt { color: var(--faint); }
  .readout dd { margin: 0; text-align: right; }
  .readout .big { font-size: 14px; color: var(--sun); }
  .readout .rate { color: var(--sky); }
  .readout .sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 4px 0; }
  .speedhud { right: 14px; bottom: 14px; width: min(360px, calc(100% - 28px)); padding: 8px 10px 6px; }
  .speedhud canvas { display: block; width: 100%; height: 110px; }
  .speedhud .lab { display: flex; justify-content: space-between; gap: 10px; color: var(--faint); font-size: 11px; }
  .speedhud .lab b { font-weight: 400; color: var(--muted); }
  .lighthud { right: 14px; top: 14px; padding: 10px 14px; pointer-events: none; display: grid; grid-template-columns: auto auto; gap: 2px 14px; }
  .lighthud dt { color: var(--faint); } .lighthud dd { margin: 0; text-align: right; }
  .lighthud .reached { color: var(--sun); }
  .status { position: absolute; right: 14px; top: 14px; font-family: var(--mono); font-size: 11px; color: var(--muted); background: rgba(4, 6, 10, 0.64); border: 1px solid var(--line); border-radius: 3px; padding: 4px 9px; pointer-events: none; }
  .status i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--sun); margin-right: 7px; animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .3 } to { opacity: 1 } }
  .datebig { position: absolute; left: 14px; bottom: 14px; font-family: var(--display); font-weight: 300; font-size: clamp(26px, 3.4vw, 42px); color: var(--ink); pointer-events: none; text-shadow: 0 1px 12px #000; line-height: 1.05; }
  .datebig small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; font-family: var(--mono); font-size: 11px; color: rgba(230, 234, 240, 0.45); pointer-events: none; white-space: nowrap; }
  @media (max-width: 1100px) { .hint { display: none; } }
  @media (max-width: 760px) { .readout { font-size: 11px; } .readout .opt { display: none; } }
  .tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; font-family: var(--mono); font-size: 11px; line-height: 1; color: rgba(230, 234, 240, 0.8); white-space: nowrap; transform: translate(8px, -50%); text-shadow: 0 0 6px #000, 0 0 2px #000; pointer-events: auto; cursor: pointer; padding: 3px 2px; }
  .tag.minor { color: rgba(230, 234, 240, 0.5); font-size: 10px; }
  .tag.sel { color: var(--sun); }
  .tag.craft { color: var(--sky); }
  .tag.ring::before { content: ""; position: absolute; left: -15px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border: 1px solid currentColor; border-radius: 50%; opacity: .7; }
  .nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

  .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; padding-block: 16px 4px; }
  .btn { appearance: none; font: 500 14px/1 var(--body); color: var(--void); background: var(--ink); border: 1px solid var(--ink); border-radius: 999px; padding: 10px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn.ghost[aria-pressed="true"] { background: var(--sky); color: var(--void); border-color: var(--sky); }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost:hover { border-color: rgba(230, 234, 240, 0.5); }
  .datein { font: 400 14px/1 var(--mono); color: var(--ink); background: transparent; border: 1px solid var(--line-strong); border-radius: 999px; padding: 9px 14px; width: 10.5em; }
  .speed { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); white-space: nowrap; flex: 1 1 300px; max-width: 480px; margin-left: auto; }
  .speed output { font-family: var(--mono); font-size: 12px; color: var(--ink); min-width: 9em; text-align: right; font-variant-numeric: tabular-nums; }

  .controls { display: grid; gap: 22px 40px; grid-template-columns: 1fr; padding-block: 18px 8px; }
  @media (min-width: 900px) { .controls { grid-template-columns: 1.25fr 1fr; } }
  .group { display: grid; gap: 10px; align-content: start; }
  .group-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { appearance: none; font: 500 13px/1 var(--body); color: var(--muted); background: transparent; border: 1px solid var(--line-strong); border-radius: 999px; padding: 9px 14px; cursor: pointer; transition: color .15s, border-color .15s, background .15s; display: inline-flex; align-items: center; gap: 8px; }
  .chip:hover { color: var(--ink); border-color: rgba(230, 234, 240, 0.45); }
  .chip:focus-visible, .btn:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  .chip[aria-pressed="true"] { color: var(--void); background: var(--ink); border-color: var(--ink); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .6; }
  .chip[aria-pressed="true"] .dot { opacity: 1; }
  .chip small { font-family: var(--mono); font-size: 11px; opacity: .75; font-weight: 400; }
  .caption { margin: 4px 0 0; padding-left: 14px; border-left: 2px solid var(--sun); color: var(--muted); font-size: 15px; max-width: 66ch; min-height: 4.8em; }
  .caption b { color: var(--ink); font-weight: 500; }
  .note { margin: 0; font-size: 13px; color: var(--faint); max-width: 60ch; }
  .note b { color: var(--muted); font-weight: 500; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); }
  input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--sun); margin-top: -6px; border: 0; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--sun); border: 0; }

  section { padding-block: 72px 8px; }
  h2 { font-family: var(--display); font-weight: 300; font-size: clamp(34px, 5vw, 58px); line-height: 1.02; letter-spacing: -0.015em; margin: 8px 0 14px; text-wrap: balance; }
  h2 em { font-style: italic; color: var(--sun); }
  .section-lede { color: var(--muted); max-width: 66ch; margin: 0 0 28px; }
  .section-lede strong { color: var(--ink); font-weight: 500; }

  .panel { position: relative; border: 1px solid var(--line); border-radius: 4px; background: var(--deep); }
  .split { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 940px) { .split { grid-template-columns: 1.15fr 1fr; } }
  .globe-wrap { position: relative; aspect-ratio: 1 / 1; max-height: 620px; width: 100%; }
  .globe-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 4px; }
  .globe-hud { position: absolute; left: 12px; top: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); pointer-events: none; line-height: 1.5; text-shadow: 0 0 6px #000; }
  .globe-hud b { color: var(--ink); font-weight: 500; }
  .globe-key { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 11px; color: var(--muted); pointer-events: none; }
  .globe-key i { display: inline-block; width: 12px; height: 8px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }
  .ecard { padding: 18px 20px; display: grid; gap: 10px; }
  .ecard h3 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.1; margin: 0; }
  .ecard .kind { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sun); }
  .ecard p { margin: 0; color: var(--muted); font-size: 15px; }
  .ecard p b { color: var(--ink); font-weight: 500; }
  .facts { display: grid; grid-template-columns: 1fr auto; margin: 4px 0 0; border-top: 1px solid var(--line); font-size: 14px; }
  .facts dt, .facts dd { padding: 7px 0; border-bottom: 1px solid var(--line); margin: 0; }
  .facts dt { color: var(--muted); }
  .facts dd { font-family: var(--mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .elist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .elist li { border-bottom: 1px solid var(--line); }
  .elist button { appearance: none; background: none; border: 0; color: var(--muted); font: 400 14px/1.4 var(--body); width: 100%; text-align: left; padding: 8px 2px; cursor: pointer; display: grid; grid-template-columns: 8.5em 1fr auto; gap: 10px; align-items: baseline; }
  .elist button:hover { color: var(--ink); }
  .elist button[aria-current="true"] { color: var(--sun); }
  .elist .d { font-family: var(--mono); font-size: 12px; color: var(--ink); }
  .elist .ty { font-family: var(--mono); font-size: 11px; color: var(--faint); text-align: right; }

  .chart-title { font-size: 14px; color: var(--ink); margin: 0 0 2px 4px; font-weight: 500; }
  .chart-unit { font-size: 12px; color: var(--faint); margin: 0 0 8px 4px; }
  .chart-pad { padding: 14px 14px 10px; }
  canvas.chart { display: block; width: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin: 8px 4px 0; }
  .legend i { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .legend i.sq { width: 9px; height: 9px; border-radius: 2px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-top: 16px; }
  .kpi { background: var(--void); padding: 14px 16px; }
  .kpi .v { font-family: var(--mono); font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .kpi .v.ein { color: var(--einstein); } .kpi .v.new { color: var(--newton); }
  .kpi .k { font-size: 12px; color: var(--faint); margin-top: 2px; }
  .slider { display: grid; grid-template-columns: 11em 1fr 8em; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  .slider output { font-family: var(--mono); font-size: 12px; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 480px) { .slider { grid-template-columns: 1fr auto; } .slider input { grid-column: 1 / -1; grid-row: 2; } }
  .rosette-wrap { aspect-ratio: 1 / 1; width: 100%; max-height: 520px; position: relative; }
  .rosette-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .overlay-note { position: absolute; left: 12px; top: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); pointer-events: none; }
  .overlay-note b { color: var(--ink); font-weight: 500; }

  .lab-wrap { position: relative; width: 100%; aspect-ratio: 2 / 1; min-height: 340px; }
  .lab-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  @media (max-width: 760px) { .lab-wrap { aspect-ratio: 1 / 1.15; } }
  .labbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 14px 0 4px; }
  .labbar .clock { font-family: var(--mono); font-size: 13px; color: var(--ink); margin-left: auto; font-variant-numeric: tabular-nums; }
  .labbar .labspeed { flex: 1 1 100%; max-width: 560px; margin-left: 0; }
  .labbar .labspeed output { min-width: 11em; }

  .guide { display: grid; gap: 1px; grid-template-columns: 1fr; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  @media (min-width: 700px) { .guide { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1040px) { .guide { grid-template-columns: 1fr 1fr 1fr; } }
  .entry { background: var(--void); padding: 26px 24px 24px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; }
  .entry .where { font-family: var(--mono); font-size: 12px; color: var(--sun); letter-spacing: 0.04em; }
  .entry h3 { font-family: var(--display); font-weight: 400; font-size: 27px; line-height: 1.12; margin: 0; text-wrap: balance; }
  .entry p { margin: 0; color: var(--muted); font-size: 15px; }
  .entry p b { color: var(--ink); font-weight: 500; }
  .show { justify-self: start; margin-top: 8px; appearance: none; background: none; border: 0; border-bottom: 1px solid var(--sky); color: var(--sky); font: 500 14px/1.4 var(--body); padding: 2px 0; cursor: pointer; text-align: left; }
  .show:hover { color: var(--ink); border-color: var(--ink); }

  .numbers { display: grid; gap: 28px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 900px) { .numbers { grid-template-columns: 1fr 1.25fr; } }
  .numbers p { margin: 0 0 14px; color: var(--muted); max-width: 60ch; }
  .numbers p b { color: var(--ink); font-weight: 500; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; min-width: 760px; font-size: 14px; }
  th, td { text-align: left; padding: 14px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
  td.num { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .name { font-family: var(--display); font-size: 21px; display: block; }
  td .sub { color: var(--faint); font-size: 13px; }
  td button { margin-top: 6px; display: block; }
  tr.kind td { padding-block: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sun); background: var(--deep); }
  .cmp { min-width: 0; }
  .cmp td, .cmp th { padding: 10px 14px; }
  .cmp td:nth-child(2), .cmp td:nth-child(3) { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
  .cmp td:nth-child(2) { color: var(--sun); }
  .cmp .why { color: var(--faint); font-size: 12px; display: block; font-family: var(--body); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: baseline; }

  footer { padding-block: 64px 48px; color: var(--faint); font-size: 13px; }
  footer p { max-width: 80ch; margin: 0 0 8px; }
  footer i { color: var(--muted); }

  /* water page additions */
  .tempctl { display: grid; gap: 6px; }
  .tempctl .tv { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 13px; color: var(--ink); }
  .tempctl .tv small { color: var(--faint); font-size: 11px; }
  .tempctl .rel { font-size: 12px; color: var(--sky); font-family: var(--mono); min-height: 1.4em; }
  .tempbar { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #6fb7ff, #9fe3ff 35%, #e6eaf0 50%, #ffc46b 70%, #ff7a45); opacity: .55; margin-top: -2px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .key i.dash { width: 16px; height: 0; border-radius: 0; border-top: 2px dashed #ffb547; vertical-align: 3px; }
  .stagekey { position: absolute; left: 14px; bottom: clamp(82px, calc(3.4vw + 50px), 104px); pointer-events: none; text-shadow: 0 0 6px #000; }
  @media (max-width: 760px) { .stagekey { display: none; } }
  .duo { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .duo-wrap { position: relative; width: 100%; aspect-ratio: 2 / 1; min-height: 320px; background: #000; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .duo-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  @media (max-width: 760px) { .duo-wrap { aspect-ratio: 1 / 1.1; } }
  .duo-lab { position: absolute; top: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); pointer-events: none; text-shadow: 0 0 6px #000; line-height: 1.5; }
  .duo-lab b { color: var(--ink); font-weight: 500; font-size: 13px; }
  .duo-lab .v { color: var(--sun); font-size: 16px; }
  .duo-lab.l { left: 14px; } .duo-lab.r { right: 14px; text-align: right; }
  .duo-foot { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--faint); pointer-events: none; }
  .bigq { font-family: var(--display); font-weight: 300; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.25; color: var(--ink); margin: 0 0 12px; max-width: 34ch; }
  .pace { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); flex: 1 1 320px; max-width: 520px; margin-left: auto; }
  .pace output { font-family: var(--mono); font-size: 12px; color: var(--ink); min-width: 12em; text-align: right; font-variant-numeric: tabular-nums; }
  .med { border-left: 2px solid var(--hot); padding-left: 16px; }
  /* quantum page */
  .plate { position: absolute; top: 0; right: 0; height: 100%; display: block; pointer-events: none; }
  .platelab { position: absolute; right: 0; bottom: 0; padding: 8px 12px 10px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); pointer-events: none; text-align: right; line-height: 1.4; background: linear-gradient(transparent, rgba(5, 7, 11, 0.92) 30%); }
  .platelab b { display: block; font-family: var(--display); font-size: 26px; font-weight: 300; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .gunlab { position: absolute; left: 14px; bottom: 14px; }
  .scalebar { position: absolute; bottom: 16px; font-family: var(--mono); font-size: 11px; color: var(--muted); pointer-events: none; text-align: center; }
  .scalebar i { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 3px; }
  .phasekey { display: inline-flex; align-items: center; gap: 8px; }
  .phasekey i { width: 46px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #ffc76b, #8a7ccf 25%, #4d8cff 50%, #8a7ccf 75%, #ffc76b); }
